name: Update Config Gist

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-gist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Configs
        run: python fetch_configs.py "testdevice"

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          # Используем встроенный GitHub CLI для обновления Gist
          # Это намного проще и надежнее, чем curl или сторонние экшны
          gh gist edit b715448f4378d930d82c5e6b6921c8e5 --add configs.txt
